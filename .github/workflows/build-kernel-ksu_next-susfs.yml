name: Build Kernel - KernelSU Next SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Making the Environment leaner
      run: sudo snap list && sudo snap remove firefox && sudo apt remove -y snapd

    - name: Update Environment
      run: sudo apt update -y

    - name: Install Dependencies
      run: |
        sudo apt install -y git-core gnupg build-essential zip \
        curl libarchive-tools flex \
        unzip python3 python3-pip python3-dev \
        python-is-python3 ccache libncurses5-dev lzop \
        patchelf git-lfs ripgrep &> /dev/null

    - name: Kernel Packaging Script
      run: |
        git clone --depth=1 -b kernel_4.19.325-packaging https://github.com/DarkS1di/kernel_packaging.git packaging/packaging

    - name: Kernel Packaging Version
      run: |
        git clone --depth=1 -b kernel_4.19.325 https://github.com/DarkS1di/kernel_packaging_version.git packaging/version

    - name: SuSFS Patches
      run: |
        git clone --depth=1 -b main https://github.com/DarkS1di/susfs-kernel-4.19.git patches/susfs

    - name: Set up Clang
      run: |
        chmod +x clang.sh
        ./clang.sh

    - name: Apply SuSFS Patches
      run: |
        set -e

        export KERNEL_ROOT=$GITHUB_WORKSPACE

        echo "Apply SuSFS Patches..."
        cp ./patches/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch $KERNEL_ROOT/

        cp ./patches/susfs/kernel_patches/fs/* $KERNEL_ROOT/fs/
        cp ./patches/susfs/kernel_patches/include/linux/* $KERNEL_ROOT/include/linux/

        cd $KERNEL_ROOT
        patch -p1 --verbose < 50_add_susfs_in_kernel-4.19.patch

        echo "SuSFS Patches Applied Successfully"

    - name: KernelSU Next SuSFS
      run: | 
        curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

    - name: Apply Configs
      run: |
        sed -i '/CONFIG_HAVE_KRETPROBES=y/a CONFIG_KPROBE_EVENTS=y' arch/arm64/configs/vendor/chime_defconfig

        cat <<'EOF' >> arch/arm64/configs/vendor/chime_defconfig

        #
        # KernelSU Next
        #
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=y
        # CONFIG_KSU_DEBUG is not set
        CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
        # CONFIG_KSU_ALLOWLIST_WORKAROUND is not set
        CONFIG_KSU_LSM_SECURITY_HOOKS=y

        #
        # SuSFS
        #
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_SU=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        EOF

    - name: Build Kernel
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Kernel Packaging Version Move
      run: |
        cp packaging/version/ksu_next-susfs/version packaging/packaging/AnyKernel3

    - name: Package Kernel
      run: |
        ZIP_NAME=electro-kernel_v4.19.325-ksu_next-susfs-$(date +"%d.%m.%Y-%H%M%S").zip
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

        cp -r packaging/packaging/AnyKernel3 .
        chmod +x packaging/packaging/pack.sh
        bash packaging/packaging/pack.sh out/arch/arm64/boot/Image $ZIP_NAME

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: electro-kernel_v4.19.325-ksu_next-susfs
        path: ${{ env.ZIP_NAME }}
