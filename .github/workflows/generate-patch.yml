name: Generate Patch

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA for patch creation'
        required: true
        type: string

jobs:
  create-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create patch
        run: |
          git format-patch -1 ${{ github.event.inputs.commit_sha }}
          echo "Patch file created."

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commit-patch
          path: '*.patch'
