name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_variant:
        description: 'Kernel Variant'
        required: true
        type: choice
        options:
          - Default
          - KernelSU
        default: 'Default'

      patch_version:
        description: 'Patch Version'
        required: true
        type: string
        default: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Update Environment
        run: |
          sudo apt update

      - name: Install Dependencies
        run: |
          sudo apt install -y build-essential libelf-dev

      - name: Set up Clang
        run: |
          chmod +x clang.sh
          ./clang.sh

      - name: Checkout Packaging Tools
        run: |
          git clone --depth=1 -b kernel-packaging https://github.com/NoxS1d-Dev/kernel-packaging.git toolchain/packaging

      - name: Checkout KernelSU Patches
        if: inputs.kernel_variant == 'KernelSU'
        run: |
          git clone --depth=1 -b main https://github.com/NoxS1d-Dev/ksu-kernel-4.19.git toolchain/kernelsu

      - name: Apply KernelSU Patches
        if: inputs.kernel_variant == 'KernelSU'
        run: |
          set -e

          export KERNEL_ROOT=$GITHUB_WORKSPACE

          echo "Apply KernelSU Patches..."
          cp ./toolchain/kernelsu/kernel_patches/add_ksu_in_kernel-4.19.patch $KERNEL_ROOT/

          cd $KERNEL_ROOT
          patch -p1 --verbose < add_ksu_in_kernel-4.19.patch

          echo "KernelSU Patches Applied Successfully"

      - name: KernelSU
        if: inputs.kernel_variant == 'KernelSU'
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -

      - name: Apply Configs
        if: inputs.kernel_variant == 'KernelSU'
        run: |
          cat <<'EOF' >> arch/arm64/configs/vendor/chime_defconfig

          #
          # KernelSU
          #
          CONFIG_KSU=y
          # CONFIG_KSU_EXTRAS is not set
          # CONFIG_KSU_KPROBES_KSUD is not set
          # CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set
          # CONFIG_KSU_KRETPROBES_SUCOMPAT is not set
          # CONFIG_KSU_DEBUG is not set
          # CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED is not set
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          EOF

      - name: Modify localversion File
        run: |
          if [[ "${{ inputs.kernel_variant }}" == "KernelSU" ]]; then
            TYPE_SUFFIX="ksu"
          else
            TYPE_SUFFIX="default"
          fi

          BASE_NAME=$(cat localversion | tr -d '\n')

          NEW_NAME="${BASE_NAME}-$(date +"%y.%m").${{ inputs.patch_version }}-${TYPE_SUFFIX}"

          echo "$NEW_NAME" > localversion

          echo "The localversion file has been successfully updated. Contents:"
          cat localversion

          ZIP_NAME="${NEW_NAME:1}" 
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package Kernel
        run: |
          cp -r toolchain/packaging/AnyKernel3 .

          sed -i "s/Electro Build.*/Electro Build : $(date +"%y.%m").${{ inputs.patch_version }}/g" AnyKernel3/version
          sed -i "s/Variant.*/Variant       : ${{ inputs.kernel_variant }}/g" AnyKernel3/version

          chmod +x toolchain/packaging/pack.sh
          bash toolchain/packaging/pack.sh out/arch/arm64/boot/Image "${{ env.ZIP_NAME }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
