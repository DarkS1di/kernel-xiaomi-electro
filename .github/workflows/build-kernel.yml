name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_variant:
        description: 'Kernel Variant'
        required: true
        type: choice
        options:
          - Default
          - KernelSU
        default: 'Default'

      patch_version:
        description: 'Patch Version'
        required: true
        type: string
        default: '0'

      flags:
        description: 'Flags'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Update Environment
        run: |
          sudo apt update

      - name: Install Dependencies
        run: |
          sudo apt install -y build-essential libelf-dev

      - name: Set up Clang
        run: |
          chmod +x clang.sh
          ./clang.sh

      - name: Prepare Environment
        run: |
          if [[ "${{ inputs.kernel_variant }}" == "KernelSU" ]]; then
            KERNEL_VARIANT="ksu"
          else
            KERNEL_VARIANT="default"
          fi

          chmod +x prepare.sh
          ./prepare.sh ${KERNEL_VARIANT} ${{ inputs.patch_version }} ${{ inputs.flags }}

      - name: Modify localversion File
        run: |
          if [[ "${{ inputs.kernel_variant }}" == "KernelSU" ]]; then
            TYPE_SUFFIX="ksu"
          else
            TYPE_SUFFIX="default"
          fi

          BASE_NAME=$(cat localversion | tr -d '\n')

          NEW_NAME="${BASE_NAME}-$(date +"%y.%m").${{ inputs.patch_version }}-${TYPE_SUFFIX}"

          echo "$NEW_NAME" > localversion

          echo "The localversion file has been successfully updated. Contents:"
          cat localversion

          ZIP_NAME="${NEW_NAME:1}" 
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Configure Build Host
        run: |
          echo "Setting KBUILD_BUILD_HOST to: ${{ runner.name }}"

          sed -i "s/export KBUILD_BUILD_HOST=\"\".*/export KBUILD_BUILD_HOST=\"${{ runner.name }}\"/g" build.sh

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Move Bengal DTB and DTBO
        run: |
          chmod +x bengal.sh
          ./bengal.sh

      - name: Build Citrus DTBO
        run: |
          chmod +x citrus.sh
          ./citrus.sh

      - name: Build Lime DTBO
        run: |
          chmod +x lime.sh
          ./lime.sh

      - name: Package Kernel
        run: |
          cp -r toolchain/packaging/AnyKernel3 .

          sed -i "s/ElectroX Build.*/ElectroX Build : $(date +"%y.%m").${{ inputs.patch_version }}/g" AnyKernel3/version
          sed -i "s/Variant.*/Variant        : ${{ inputs.kernel_variant }}/g" AnyKernel3/version

          chmod +x toolchain/packaging/pack.sh
          bash toolchain/packaging/pack.sh \
          out/arch/arm64/boot/Image \
          out/arch/arm64/boot/bengal/dtb \
          out/arch/arm64/boot/citrus/dtbo.img \
          out/arch/arm64/boot/lime/dtbo.img \
          "${{ env.ZIP_NAME }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
