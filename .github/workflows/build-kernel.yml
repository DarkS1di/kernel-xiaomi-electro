name: Build Kernel - Default

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Update Environment
        run: |
          sudo apt update

      - name: Install Dependencies
        run: |
          sudo apt install -y build-essential libelf-dev

      - name: Set up Clang
        run: |
          chmod +x clang.sh
          ./clang.sh

      - name: Checkout Packaging Tools
        run: |
          git clone --depth=1 -b kernel_4.19.325-packaging https://github.com/DarkS1di/kernel_packaging.git toolchain/packaging
          git clone --depth=1 -b kernel_4.19.325 https://github.com/DarkS1di/kernel_packaging_version.git toolchain/packaging/version

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package Kernel
        run: |
          ZIP_NAME=electro-kernel_v4.19.325-default-$(date +"%d.%m.%Y-%H%M%S").zip
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          cp toolchain/packaging/version/default/version toolchain/packaging/AnyKernel3

          cp -r toolchain/packaging/AnyKernel3 .
          chmod +x toolchain/packaging/pack.sh
          bash toolchain/packaging/pack.sh out/arch/arm64/boot/Image $ZIP_NAME

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: electro-kernel_v4.19.325-default
          path: ${{ env.ZIP_NAME }}
