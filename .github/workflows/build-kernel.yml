name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_variant:
        description: 'Kernel Variant'
        required: true
        type: choice
        options:
          - Default
          - KernelSU
        default: 'Default'

      patch_version:
        description: 'Patch Version'
        required: true
        type: string
        default: '0'

      flags:
        description: 'Flags'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libelf-dev

          chmod +x clang.sh
          ./clang.sh

      - name: Prepare Environment
        run: |
          if [[ "${{ inputs.kernel_variant }}" == "KernelSU" ]]; then
            KERNEL_VARIANT="ksu"
          else
            KERNEL_VARIANT="default"
          fi

          chmod +x prepare.sh
          ./prepare.sh ${KERNEL_VARIANT} ${{ inputs.patch_version }} ${{ inputs.flags }}

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Move Bengal DTB and DTBO
        run: |
          chmod +x bengal.sh
          ./bengal.sh

      - name: Build Citrus DTBO
        run: |
          chmod +x citrus.sh
          ./citrus.sh

      - name: Build Lime DTBO
        run: |
          chmod +x lime.sh
          ./lime.sh

      - name: Package Kernel
        run: |
          chmod +x toolchain/packaging/pack.sh
          bash toolchain/packaging/pack.sh \
          out/arch/arm64/boot/Image \
          out/arch/arm64/boot/bengal/dtb \
          out/arch/arm64/boot/citrus/dtbo.img \
          out/arch/arm64/boot/lime/dtbo.img \
          "${{ env.FULL_KERNEL_NAME }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FULL_KERNEL_NAME }}
          path: ${{ env.FULL_KERNEL_NAME }}.zip
