name: Import Specific Folders

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Donor Repository URL'
        required: true
        type: string

      target_ref:
        description: 'Branch or Tag of Donor'
        required: true
        type: string

      paths_to_copy:
        description: 'Paths to Import'
        required: true
        type: string

jobs:
  import-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Fetch Repository
        run: |
          echo "Adding donor remote..."
          git remote add donor ${{ inputs.repo_url }}

          echo "Fetching ${{ inputs.target_ref }}..."
          git fetch donor ${{ inputs.target_ref }}

      - name: Import Paths
        run: |
          echo "Completely replacing local paths with donor's files..."

          for path_to_remove in ${{ inputs.paths_to_copy }}; do
            echo "Deleting old local path: $path_to_remove"
            git rm -rf --ignore-unmatch "$path_to_remove"
          done

          echo "Checking out clean files from donor..."
          git checkout FETCH_HEAD -- ${{ inputs.paths_to_copy }}

      - name: Push Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Import: ${{ inputs.paths_to_copy }}" \
                       -m "Donor Repository: ${{ inputs.repo_url }}" \
                       -m "Target Ref: ${{ inputs.target_ref }}"
            git push origin HEAD
            echo "Files successfully imported and pushed!"
          else
            echo "No changes detected. The paths are already identical."
          fi
