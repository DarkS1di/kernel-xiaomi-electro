name: Universal Kernel Integrator

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL Repository'
        required: true
        type: string

      target_ref:
        description: 'Branch or Tag'
        required: true
        type: string

      paths_to_copy:
        description: 'Paths to Import'
        required: false
        type: string

      protected_commits:
        description: 'Protected Commits'
        required: false
        type: string

      upload_conflicts:
        description: 'Upload Conflict Files'
        required: false
        type: boolean
        default: true

      force_push_conflicts:
        description: 'Force Push Conflict Files'
        required: false
        type: boolean
        default: false

jobs:
  integrate-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Merge or Import
        id: merge_attempt
        continue-on-error: true
        run: |
          echo "Adding remote: ${{ inputs.repo_url }}"
          git remote add upstream ${{ inputs.repo_url }}

          echo "Fetching: ${{ inputs.target_ref }}"
          git fetch upstream ${{ inputs.target_ref }}

          if [ -z "${{ inputs.paths_to_copy }}" ]; then
            echo "No paths provided. Merging: ${{ inputs.target_ref }}"
            git merge FETCH_HEAD --no-edit
          else
            echo "Importing specific paths: ${{ inputs.paths_to_copy }}"
            for path_to_remove in ${{ inputs.paths_to_copy }}; do
              git rm -rf --ignore-unmatch "$path_to_remove"
            done
            
            git checkout FETCH_HEAD -- ${{ inputs.paths_to_copy }}
            
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "IMPORT PATHS: ${{ inputs.paths_to_copy }} from ${{ inputs.target_ref }} ($(git rev-parse --short FETCH_HEAD))"
            fi

            if [ -n "${{ inputs.protected_commits }}" ]; then
              COMMITS=$(echo "${{ inputs.protected_commits }}" | tr ',' ' ')
              for commit in $COMMITS; do
                echo "Applying protected commit: $commit..."
                if ! git cherry-pick --allow-empty --keep-redundant-commits $commit; then
                  echo "Merge conflict detected on $commit!"
                  echo "Leaving conflict markers in place for artifact collection."
                  exit 1
                fi
              done
            fi
          fi

      - name: Collect Conflict Files
        if: steps.merge_attempt.outcome == 'failure' && inputs.upload_conflicts == true
        run: |
          echo "Merge or Import failed with conflicts. Collecting files..."
          mkdir -p conflict_files

          git diff --name-only --diff-filter=U | while read file; do
            mkdir -p "conflict_files/$(dirname "$file")"
            cp "$file" "conflict_files/$file"
            echo "Collected: $file"
          done

      - name: Upload Artifact
        if: steps.merge_attempt.outcome == 'failure' && inputs.upload_conflicts == true
        uses: actions/upload-artifact@v7
        with:
          name: conflict-files-${{ github.run_id }}
          path: conflict_files

      - name: Push Changes
        run: |
          if [ "${{ steps.merge_attempt.outcome }}" == "success" ]; then
            echo "Merge or Import successful. Pushing..."
            git push origin HEAD
            exit 0
          fi

          if [ "${{ steps.merge_attempt.outcome }}" == "failure" ] && [ "${{ inputs.force_push_conflicts }}" == "true" ]; then
            echo "WARNING: Pushing broken code with conflict markers!"
            rm -rf conflict_files

            git add .
            git commit -m "FORCE COMMIT: Committing conflicts from ${{ inputs.target_ref }} ($(git rev-parse --short FETCH_HEAD))"
            git push origin HEAD
            exit 0
          fi

          if [ "${{ steps.merge_attempt.outcome }}" == "failure" ]; then
            echo "Merge or Import failed! Please resolve conflicts manually."
            exit 1
          fi
